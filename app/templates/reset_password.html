<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth_modern.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <span class="eyebrow">Seguridad</span>
            <h1>Nueva contraseña</h1>
            <p>Define una nueva clave para recuperar el acceso a tu cuenta.</p>

            <div class="auth-section">
                {% if token_valido %}
                    <form method="POST">
                        <div class="input-group">
                            <label for="password">Nueva contraseña</label>
                            <input id="password" type="password" name="password" placeholder="Escribe una nueva contraseña" required>
                        </div>
                        <div class="input-group">
                            <label for="password_confirm">Confirmar contraseña</label>
                            <input id="password_confirm" type="password" name="password_confirm" placeholder="Repite la nueva contraseña" required>
                        </div>
                        <button type="submit">Guardar contraseña</button>
                    </form>
                {% endif %}

                {% if error %}
                    <p class="msg-error">{{ error }}</p>
                {% endif %}
            </div>

            <a class="back-link" href="{{ url_for('auth.login') }}">Volver al login</a>
        </section>
    </main>
</body>
</html>
