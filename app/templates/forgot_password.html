<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth_modern.css') }}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <span class="eyebrow">Recuperación</span>
            <h1>Restablece tu acceso</h1>
            <p>Ingresa el correo asociado a tu cuenta para generar un enlace de recuperación.</p>

            <div class="auth-section">
                <form method="POST">
                    <div class="input-group">
                        <label for="email">Correo electrónico</label>
                        <input id="email" type="email" name="email" placeholder="usuario@empresa.com" required>
                    </div>
                    <button type="submit">Generar enlace</button>
                </form>

                {% if mensaje %}
                    <p class="{% if reset_link %}msg-ok{% else %}msg-info{% endif %}">{{ mensaje }}</p>
                {% endif %}
                {% if reset_link %}
                    <a class="link-box" href="{{ reset_link }}">{{ reset_link }}</a>
                {% endif %}
            </div>

            <a class="back-link" href="{{ url_for('auth.login') }}">Volver al login</a>
        </section>
    </main>
</body>
</html>
